name: Type Safety Enforcement

on:
  push:
    branches:
      - main
      - develop
      - "infra-*"
      - "feature/*"
      - "fix/*"
  pull_request:
    branches:
      - main
      - develop

env:
  BUN_VERSION: "1.3.9"

jobs:
  # ── Step 1: TypeScript Type Check ──────────────────────────────────────
  typecheck:
    name: "TypeScript — Strict Mode Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check source code
        run: bun run typecheck:src

      - name: Type check test files
        run: bun run typecheck:tests

  # ── Step 2: Type Safety Guard (Architecture) ───────────────────────────
  type-safety-guard:
    name: "Type Safety Guard — Pattern Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type safety guard
        run: |
          echo "Type Safety Guard Check (Phase: Layer 3 - Deferred)"
          echo "This job will detect :any, as any, <any> patterns and @ts-ignore comments"
          echo "Guard script implementation deferred to Phase 1 (Post-MVP)"
          echo "Current status: Layer 1 (Strict Mode) complete - Layer 5 (CI Enforcement) in progress"

  # ── Step 3: Inclusive Linting (Biome) ──────────────────────────────────
  lint:
    name: "Biome — Lint & Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint + format check
        run: bun run lint

  # ── Summary: Type Safety Enforcement Complete ──────────────────────────
  type-safety-complete:
    name: "Type Safety Pipeline Complete"
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - type-safety-guard
      - lint
    if: success()
    steps:
      - name: Report success
        run: |
          echo "✅ Type Safety Enforcement Pipeline Passed"
          echo ""
          echo "Checks completed:"
          echo "  ✓ TypeScript Strict Mode — 0 errors"
          echo "  ✓ Type Safety Guard — Pattern detection deferred to Phase 1"
          echo "  ✓ Biome Linting — Format and style compliance"
          echo ""
          echo "Next steps:"
          echo "  - Phase 1 (Post-MVP): Implement Guard script for any/as any/@ts-ignore detection"
          echo "  - Phase 2 (Post-MVP): Domain layer protection (domain-core, types, validation)"
          echo "  - Phase 3+: Runtime validation, boundary typing, AI governance"
