name: Zidney Architecture Governance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  architecture-governance:
    name: Architecture Governance Checks
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Bun ───────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # ── 3. Install dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: bun install

      # ── 4. Verify AI Bootstrap Exists ──────────────────────────────────
      - name: Verify AI Bootstrap Exists
        run: |
          if [ ! -f docs/ai/AI_BOOTSTRAP.md ]; then
            echo "❌ AI bootstrap file missing: docs/ai/AI_BOOTSTRAP.md"
            exit 1
          fi

      # ── 5. Run Zidney AI Guard ─────────────────────────────────────────
      - name: Run Zidney AI Guard
        run: bun scripts/ai-guard.ts

      # ── 6. Run Infrastructure Audit ────────────────────────────────────
      - name: Run Infrastructure Audit (full repo architecture audit)
        run: bun scripts/infra-audit.ts --ci

      # ── 7. Run Architecture Diff ───────────────────────────────────────
      - name: Run Architecture Diff (PR-specific architecture drift check)
        run: bun scripts/architecture-diff.ts

      # ── 8. Publish Architecture Summary ────────────────────────────────
      - name: Publish Architecture Summary
        if: always()
        run: |
          echo "## Zidney Architecture Governance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f docs/architecture/audit/infra-audit-report.json ]; then
            echo "### Infrastructure Audit" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat docs/architecture/audit/infra-audit-report.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Infrastructure audit report not found." >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f docs/architecture/graph/infra-dependency-graph.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Dependency Graph Snapshot" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat docs/architecture/graph/infra-dependency-graph.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
