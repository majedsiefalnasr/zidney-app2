name: Zidney Architecture Governance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 2 * * *"

env:
  BUN_VERSION: "1.3.11"

jobs:
  architecture-governance:
    name: Architecture Governance Checks
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Bun ───────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── 3. Install dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: bun install

      # ── 4. Verify AI Bootstrap Exists ──────────────────────────────────
      - name: Verify AI Bootstrap Exists
        run: |
          if [ ! -f docs/ai/AI_BOOTSTRAP.md ]; then
            echo "❌ AI bootstrap file missing: docs/ai/AI_BOOTSTRAP.md"
            exit 1
          fi

      # ── 5. Run Zidney AI Guard ─────────────────────────────────────────
      - name: Run Zidney AI Guard
        run: bun scripts/ai-guard.ts

      # ── 6. Run Infrastructure Audit ────────────────────────────────────
      - name: Run Infrastructure Audit (full repo architecture audit)
        run: bun scripts/infra-audit.ts --ci

      # ── 7. Run Architecture Diff ───────────────────────────────────────
      - name: Run Architecture Diff (PR-specific architecture drift check)
        run: bun scripts/architecture-diff.ts

      # ── 8. Run Architecture Health ─────────────────────────────────────
      - name: Run Architecture Health
        run: bun run arch:health:ci

      # ── 9. Upload Architecture Health Artifacts ───────────────────────
      - name: Upload Architecture Health Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-health-artifacts
          path: |
            docs/architecture/health/architecture-health.json
            docs/architecture/health/architecture-health-summary.md
            docs/architecture/health/architecture-drift-report.md
            docs/architecture/health/history/

      # ── 10. Publish Architecture Summary ───────────────────────────────
      - name: Publish Architecture Summary
        if: always()
        run: |
          # Build a concise architecture summary and append once to the step summary
          {
            echo "## Zidney Architecture Governance Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f docs/architecture/audit/infra-audit-report.json ]; then
            {
              echo "### Infrastructure Audit"
              echo "~~~json"
              cat docs/architecture/audit/infra-audit-report.json
              echo "~~~"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Infrastructure audit report not found." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f docs/architecture/graph/infra-dependency-graph.json ]; then
            {
              echo ""
              echo "### Dependency Graph Snapshot"
              echo "~~~json"
              cat docs/architecture/graph/infra-dependency-graph.json
              echo "~~~"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f docs/architecture/health/architecture-health-summary.md ]; then
            {
              echo ""
              echo "### Architecture Health"
              cat docs/architecture/health/architecture-health-summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 11. Run AI Execution Validation ───────────────────────────────
      - name: Run AI Execution Validation
        run: bun ai:validate --ci

      # ── 12. Upload AI Execution Artifact ──────────────────────────────
      - name: Upload AI Execution Validation Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-execution-validation-artifact
          path: docs/architecture/health/ai-execution-logs/

      # ── 13. Publish AI Execution Summary ──────────────────────────────
      - name: Publish AI Execution Summary
        if: always()
        run: |
          {
            echo "## AI Execution Validation Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          LATEST=$(find docs/architecture/health/ai-execution-logs -maxdepth 1 -name "*.json" 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST" ]; then
            {
              echo "### Latest Execution Log"
              echo "~~~json"
              cat "$LATEST"
              echo "~~~"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No AI execution log artifacts found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Script System Governance ──────────────────────────────────────

      # ── 14. Validate Script Naming Convention ──────────────────────────
      - name: Validate Script Naming Convention
        run: bun run validate:script:naming

      # ── 15. Validate Script Usages ─────────────────────────────────────
      - name: Validate Script Usages (no broken or orphan references)
        run: bun run validate:script:usage

      # ── 16. Validate Script Infrastructure ────────────────────────────
      - name: Validate Script Infrastructure (headers + registry freshness)
        run: bun run validate:script:infrastructure

      # ── 17. Verify Script Registry Generation ─────────────────────────
      - name: Verify Script Registry Generation
        run: bun run dev:generate:script-docs

      # ── 18. Unified Governance Gate ─────────────────────────────────────
      - name: Unified Governance Gate
        run: bun run governance:gate:ci
