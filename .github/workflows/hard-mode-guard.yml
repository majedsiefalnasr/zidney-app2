name: Hard Mode Guard

on:
  push:
    branches:
      - "spec/*"
  pull_request:
    branches:
      - "spec/*"

jobs:
  validate:
    name: Hard Mode Workflow State
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Resolve stage directory from branch name ────────────────────
      - name: Resolve stage directory
        id: stage
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"

          STRIPPED_BRANCH="${BRANCH#spec/}"

          # Allowed patterns:
          #   NNN-kebab-name           → 020-status-workflow-engine
          #   prefix-NNN-kebab-name    → infra-001-typescript-stabilization
          #                            → ui-02-api-client-layer
          if ! echo "$STRIPPED_BRANCH" | grep -qE '^([a-z]+-)?[0-9]{2,3}[A-Z]?-'; then
            echo "❌ Branch '$BRANCH' does not match the Hard Mode naming pattern."
            echo "   Allowed: NNN-name  or  prefix-NNN-name"
            echo "   Examples: 020-status-workflow-engine, infra-001-typescript-stabilization, ui-02-api-client-layer"
            exit 1
          fi

          STAGE_DIR="specs/runtime/${STRIPPED_BRANCH}"
          STATE_FILE="${STAGE_DIR}/.workflow-state.json"

          echo "stage_dir=${STAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "state_file=${STATE_FILE}" >> "$GITHUB_OUTPUT"
          echo "branch=${STRIPPED_BRANCH}" >> "$GITHUB_OUTPUT"

          echo "✅ Branch  : $BRANCH"
          echo "✅ Stage branch : $STRIPPED_BRANCH"
          echo "✅ Stage   : $STAGE_DIR"
          echo "✅ State   : $STATE_FILE"

      # ── 3. Validate state file ─────────────────────────────────────────
      - name: Validate state file
        env:
          STATE_FILE: ${{ steps.stage.outputs.state_file }}
          BRANCH: ${{ steps.stage.outputs.branch }}
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
        run: |
          fail() { echo "❌ $1"; exit 1; }

          # Exists
          [ -f "$STATE_FILE" ] || fail "$STATE_FILE not found. Was it committed? (orchestrator creates it in Pre.5)"

          # Valid JSON
          jq empty "$STATE_FILE" 2>/dev/null || fail "$STATE_FILE is not valid JSON"
          echo "✅ State file exists and is valid JSON"

          # Required fields present and non-empty
          for field in stage phase stage_dir stage_file branch base_branch current_step stage_status last_updated; do
            val=$(jq -r ".[\"$field\"] // empty" "$STATE_FILE")
            [ -n "$val" ] || fail "Missing or empty required field: $field"
          done
          echo "✅ Required fields present"

          # branch matches PR branch
          STATE_BRANCH=$(jq -r '.branch' "$STATE_FILE")
          [ "$STATE_BRANCH" = "$BRANCH" ] || fail "state.branch '$STATE_BRANCH' does not match PR branch '$BRANCH'"
          echo "✅ Branch matches"

          # stage_dir matches expected path
          STATE_DIR=$(jq -r '.stage_dir' "$STATE_FILE")
          [ "$STATE_DIR" = "$STAGE_DIR" ] || fail "state.stage_dir '$STATE_DIR' must be '$STAGE_DIR'"
          echo "✅ Stage dir matches"

          # stage_status is a valid value
          STATUS=$(jq -r '.stage_status' "$STATE_FILE")
          case "$STATUS" in
            "DRAFT"|"IN PROGRESS"|"BACKEND CLOSED"|"PRODUCTION READY"|"PRODUCTION HARDENED"|"DEPRECATED")
              echo "✅ stage_status: $STATUS" ;;
            *) fail "Invalid stage_status: '$STATUS'" ;;
          esac

          # current_step is a valid value
          STEP=$(jq -r '.current_step' "$STATE_FILE")
          case "$STEP" in
            "pre_step"|"specify"|"clarify"|"plan"|"tasks"|"analyze"|"implement"|"stage_production_ready")
              echo "✅ current_step: $STEP" ;;
            *) fail "Invalid current_step: '$STEP'" ;;
          esac

          # Boolean fields
          for field in clarifications_resolved drift_passed implementation_allowed plan_completed; do
            val=$(jq -r ".[\"$field\"] | type" "$STATE_FILE")
            [ "$val" = "boolean" ] || fail "Field '$field' must be boolean, got: $val"
          done
          echo "✅ Boolean fields valid"

          # History non-empty and starts with branch_created
          HIST_LEN=$(jq '.history | length' "$STATE_FILE")
          [ "$HIST_LEN" -gt 0 ] || fail "history must be a non-empty array"
          FIRST=$(jq -r '.history[0].event' "$STATE_FILE")
          [ "$FIRST" = "branch_created" ] || fail "history[0].event must be 'branch_created', got '$FIRST'"
          echo "✅ History valid ($HIST_LEN events)"

      # ── 4. Validate step consistency and history chain ─────────────────
      - name: Validate step consistency
        env:
          STATE_FILE: ${{ steps.stage.outputs.state_file }}
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
        run: |
          fail() { echo "❌ $1"; exit 1; }
          has_event() { jq -e --arg e "$1" '.history[] | select(.event == $e)' "$STATE_FILE" > /dev/null 2>&1; }

          STEP=$(jq -r '.current_step'            "$STATE_FILE")
          STATUS=$(jq -r '.stage_status'           "$STATE_FILE")
          CLARIFIED=$(jq -r '.clarifications_resolved' "$STATE_FILE")
          DRIFT=$(jq -r '.drift_passed'            "$STATE_FILE")
          IMPL=$(jq -r '.implementation_allowed'   "$STATE_FILE")
          PLAN=$(jq -r '.plan_completed'           "$STATE_FILE")
          T_TOTAL=$(jq -r '.tasks_total // "null"' "$STATE_FILE")
          T_DONE=$(jq -r '.tasks_completed // "null"' "$STATE_FILE")

          echo "Checking: step=$STEP  status=$STATUS"

          case "$STEP" in
            pre_step)
              [ "$STATUS"    = "DRAFT" ]   || fail "pre_step requires DRAFT, got '$STATUS'"
              [ "$CLARIFIED" = "false" ]   || fail "pre_step: clarifications_resolved must be false"
              [ "$PLAN"      = "false" ]   || fail "pre_step: plan_completed must be false"
              [ "$DRIFT"     = "false" ]   || fail "pre_step: drift_passed must be false"
              [ "$IMPL"      = "false" ]   || fail "pre_step: implementation_allowed must be false"
              ;;
            specify)
              [ "$STATUS" = "DRAFT" ]      || fail "specify requires DRAFT, got '$STATUS'"
              has_event "branch_created"   || fail "specify: missing history event 'branch_created'"
              ;;
            clarify)
              [ "$STATUS"    = "DRAFT" ]   || fail "clarify requires DRAFT, got '$STATUS'"
              [ "$CLARIFIED" = "true" ]    || fail "clarify: clarifications_resolved must be true"
              has_event "specify_complete" || fail "clarify: missing history event 'specify_complete'"
              ;;
            plan)
              [ "$STATUS"    = "DRAFT" ]   || fail "plan requires DRAFT, got '$STATUS'"
              [ "$PLAN"      = "true" ]    || fail "plan: plan_completed must be true"
              [ "$CLARIFIED" = "true" ]    || fail "plan: clarifications_resolved must be true"
              has_event "clarifications_locked" || fail "plan: missing history event 'clarifications_locked'"
              ;;
            tasks)
              [ "$STATUS" = "DRAFT" ]      || fail "tasks requires DRAFT, got '$STATUS'"
              [ "$PLAN"   = "true" ]       || fail "tasks: plan_completed must be true"
              [ "$T_TOTAL" != "null" ] && [ "$T_TOTAL" -ge 1 ] 2>/dev/null \
                                           || fail "tasks: tasks_total must be >= 1, got '$T_TOTAL'"
              [ "$T_DONE" = "0" ]          || fail "tasks: tasks_completed must be 0, got '$T_DONE'"
              has_event "plan_complete"    || fail "tasks: missing history event 'plan_complete'"
              ;;
            analyze)
              [ "$STATUS" = "IN PROGRESS" ] || fail "analyze requires IN PROGRESS, got '$STATUS'"
              [ "$DRIFT"  = "$IMPL" ]        || fail "analyze: drift_passed ($DRIFT) and implementation_allowed ($IMPL) must match"
              has_event "tasks_complete"     || fail "analyze: missing history event 'tasks_complete'"
              if [ "$DRIFT" = "true" ]; then
                has_event "drift_analysis_blocked" && fail "drift_passed=true but history contains 'drift_analysis_blocked'"
              fi
              ;;
            implement)
              [ "$STATUS" = "BACKEND CLOSED" ] || fail "implement requires BACKEND CLOSED, got '$STATUS'"
              [ "$DRIFT"  = "true" ]           || fail "implement: drift_passed must be true"
              [ "$IMPL"   = "true" ]           || fail "implement: implementation_allowed must be true"
              [ "$T_DONE" -le "$T_TOTAL" ] 2>/dev/null \
                                               || fail "implement: tasks_completed ($T_DONE) cannot exceed tasks_total ($T_TOTAL)"
              has_event "drift_analysis_passed" || fail "implement: missing history event 'drift_analysis_passed'"

              # Cross-check tasks.md [X] count
              TASKS_FILE="$STAGE_DIR/tasks.md"
              if [ -f "$TASKS_FILE" ]; then
                ACTUAL_DONE=$(grep -c '^- \[X\]' "$TASKS_FILE" || true)
                ACTUAL_TOTAL=$(grep -cE '^- \[[ X]\]' "$TASKS_FILE" || true)
                [ "$ACTUAL_DONE"  = "$T_DONE"  ] || fail "tasks_completed ($T_DONE) != [X] count in tasks.md ($ACTUAL_DONE)"
                [ "$ACTUAL_TOTAL" = "$T_TOTAL" ] || fail "tasks_total ($T_TOTAL) != task count in tasks.md ($ACTUAL_TOTAL)"
                echo "✅ tasks.md: $ACTUAL_DONE/$ACTUAL_TOTAL completed"
              fi
              ;;
            stage_production_ready)
              [ "$STATUS"    = "PRODUCTION READY" ] || fail "closure requires PRODUCTION READY, got '$STATUS'"
              [ "$CLARIFIED" = "true" ]             || fail "closure: clarifications_resolved must be true"
              [ "$DRIFT"     = "true" ]             || fail "closure: drift_passed must be true"
              [ "$IMPL"      = "true" ]             || fail "closure: implementation_allowed must be true"
              [ "$PLAN"      = "true" ]             || fail "closure: plan_completed must be true"
              [ "$T_TOTAL"   != "null" ] && [ "$T_TOTAL" -ge 1 ] 2>/dev/null \
                                                    || fail "closure: tasks_total must be >= 1, got '$T_TOTAL'"
              [ "$T_DONE"    = "$T_TOTAL" ]         || fail "closure: tasks_completed ($T_DONE) must equal tasks_total ($T_TOTAL)"
              has_event "stage_backend_closed"      || fail "closure: missing history event 'stage_backend_closed'"
              has_event "pre_closure_review_approved" || fail "closure: missing history event 'pre_closure_review_approved'"

              # Cross-check tasks.md — all must be [X]
              TASKS_FILE="$STAGE_DIR/tasks.md"
              if [ -f "$TASKS_FILE" ]; then
                ACTUAL_DONE=$(grep -c '^- \[X\]' "$TASKS_FILE" || true)
                ACTUAL_TOTAL=$(grep -cE '^- \[[ X]\]' "$TASKS_FILE" || true)
                INCOMPLETE=$((ACTUAL_TOTAL - ACTUAL_DONE))
                [ "$INCOMPLETE" = "0" ] || fail "$INCOMPLETE incomplete task(s) in tasks.md at closure"
                echo "✅ tasks.md: all $ACTUAL_DONE/$ACTUAL_TOTAL tasks complete"
              fi
              ;;
          esac

          echo "✅ Step consistency valid"

      # ── 5. Validate files on disk match current step ───────────────────
      - name: Validate directory structure
        env:
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
          STATE_FILE: ${{ steps.stage.outputs.state_file }}
        run: |
          STEP=$(jq -r '.current_step' "$STATE_FILE")
          ERRORS=0

          need_file() { [ -f "$1" ] || { echo "   ❌ MISSING: $1"; ERRORS=$((ERRORS+1)); }; }
          need_dir()  { [ -d "$1" ] || { echo "   ❌ MISSING dir: $1"; ERRORS=$((ERRORS+1)); }; }

          echo "Step: $STEP — checking required files..."

          # Always required after Pre.5
          need_file "$STAGE_DIR/.workflow-state.json"
          need_file "$STAGE_DIR/README.md"
          need_dir  "$STAGE_DIR/reports"
          need_dir  "$STAGE_DIR/audits"
          need_dir  "$STAGE_DIR/guides"

          # After specify
          [[ "$STEP" == "pre_step" ]] || {
            need_file "$STAGE_DIR/spec.md"
            need_file "$STAGE_DIR/reports/SPECIFY_REPORT.md"
          }

          # After clarify
          [[ "$STEP" =~ ^(pre_step|specify)$ ]] || {
            need_file "$STAGE_DIR/reports/CLARIFY_REPORT.md"
          }

          # After plan
          [[ "$STEP" =~ ^(pre_step|specify|clarify)$ ]] || {
            need_file "$STAGE_DIR/plan.md"
            need_file "$STAGE_DIR/reports/PLAN_REPORT.md"
          }

          # After tasks
          [[ "$STEP" =~ ^(pre_step|specify|clarify|plan)$ ]] || {
            need_file "$STAGE_DIR/tasks.md"
            need_file "$STAGE_DIR/reports/TASKS_REPORT.md"
          }

          # After analyze
          [[ "$STEP" =~ ^(pre_step|specify|clarify|plan|tasks)$ ]] || {
            need_file "$STAGE_DIR/audits/ANALYZE_REPORT.md"
          }

          # After implement
          [[ "$STEP" =~ ^(pre_step|specify|clarify|plan|tasks|analyze)$ ]] || {
            need_file "$STAGE_DIR/reports/IMPLEMENT_REPORT.md"
            need_file "$STAGE_DIR/audits/VALIDATION_REPORT.md"
          }

          # At closure
          [[ "$STEP" != "stage_production_ready" ]] || {
            need_file "$STAGE_DIR/reports/CLOSURE_REPORT.md"
            need_file "$STAGE_DIR/guides/TESTING_GUIDE.md"
            need_file "$STAGE_DIR/PR_SUMMARY.md"
          }

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS missing file(s) for step '$STEP'"
            exit 1
          fi
          echo "✅ All required files present"

      # ── 6. Summary ────────────────────────────────────────────────────
      - name: Summary
        env:
          STATE_FILE: ${{ steps.stage.outputs.state_file }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Hard Mode Guard — all checks passed  "
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          jq -r '
            "  Branch  : " + .branch,
            "  Stage   : " + .stage,
            "  Phase   : " + .phase,
            "  Step    : " + .current_step,
            "  Status  : " + .stage_status,
            (if .tasks_total then "  Tasks   : " + (.tasks_completed|tostring) + "/" + (.tasks_total|tostring) + " completed" else empty end),
            "  Updated : " + .last_updated,
            "  History : " + (.history|length|tostring) + " events"
          ' "$STATE_FILE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
