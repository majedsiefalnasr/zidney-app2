name: MMC Dashboard - CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mmc-dashboard

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # LINT - Static Analysis
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Run lint on all affected apps
        app: [api, mmc, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint - apps/${{ matrix.app }}
        run: bun run lint --filter=apps/${{ matrix.app }}
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # TYPE CHECK - TypeScript Compilation
  # ────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, mmc, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check - apps/${{ matrix.app }}
        run: bun run typecheck --filter=apps/${{ matrix.app }}
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # UNIT TESTS - Business Logic
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, mmc, worker]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests - apps/${{ matrix.app }}
        run: bun run test:unit --filter=apps/${{ matrix.app }}
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # INTEGRATION TESTS - API Flows
  # ────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

      - name: Run integration tests - MMC Dashboard
        run: bun run test:integration apps/mmc/tests/
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # SECURITY TESTS - Authorization, Rate Limiting, SQL Injection
  # ────────────────────────────────────────────────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security tests - MMC Dashboard
        run: bun run test:security apps/mmc/tests/
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # PERFORMANCE TESTS - SLA Validation
  # ────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run performance tests - MMC Dashboard
        run: bun run test:performance apps/mmc/tests/
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────────
  # BUILD - Docker Image
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      [lint, typecheck, integration-tests, security-tests, performance-tests]
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ────────────────────────────────────────────────────────────────────────
  # DEPLOY TO STAGING - Automatic on merge to develop
  # ────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging-mmc.dashboard.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Short Commit SHA
        id: commit
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy via Terraform
        env:
          TF_VAR_image_tag: ${{ steps.commit.outputs.sha_short }}
          TF_VAR_environment: staging
        run: |
          cd terraform
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                        -backend-config="key=mmc-dashboard-staging/terraform.tfstate" \
                        -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Run staging smoke tests
        env:
          API_URL: https://staging-mmc-api.example.com
          JWT_TOKEN: ${{ secrets.STAGING_JWT_TOKEN }}
        run: bun run test:smoke apps/mmc/tests/smoke/

      - name: Notify deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Deployed to Staging** - https://staging-mmc.dashboard.example.com\n\nSmoke tests: **PASSED**'
            })

  # ────────────────────────────────────────────────────────────────────────
  # DEPLOY TO PRODUCTION - Manual approval on main
  # ────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://mmc.dashboard.example.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Short Commit SHA
        id: commit
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create deployment record
        run: |
          aws dynamodb put-item \
            --table-name mmc-dashboard-deployments \
            --item "{
              \"deployment_id\": {\"S\": \"${{ github.run_id }}\"},
              \"timestamp\": {\"N\": \"$(date +%s)\"},
              \"git_sha\": {\"S\": \"${{ github.sha }}\"},
              \"status\": {\"S\": \"in_progress\"},
              \"triggered_by\": {\"S\": \"${{ github.actor }}\"}
            }"

      - name: Backup production database (safety)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Take RDS snapshot before deployment
          aws rds create-db-snapshot \
            --db-instance-identifier mmc-dashboard-prod \
            --db-snapshot-identifier mmc-dashboard-prod-$(date +%s)

      - name: Deploy via Terraform (Blue/Green)
        env:
          TF_VAR_image_tag: ${{ steps.commit.outputs.sha_short }}
          TF_VAR_environment: production
          TF_VAR_deployment_strategy: blue_green
        run: |
          cd terraform
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                        -backend-config="key=mmc-dashboard-production/terraform.tfstate" \
                        -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Run production smoke tests
        env:
          API_URL: https://mmc-api.example.com
          JWT_TOKEN: ${{ secrets.PRODUCTION_JWT_TOKEN }}
        run: bun run test:smoke apps/mmc/tests/smoke/

      - name: Verify production metrics
        run: |
          # Check P99 latency from CloudWatch
          aws cloudwatch get-metric-statistics \
            --namespace=MMC/Dashboard \
            --metric-name=RequestLatency \
            --dimensions Name=Percentile,Value=P99 \
            --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
            --period=300 \
            --statistics=Average

      - name: Update deployment record (success)
        if: success()
        run: |
          aws dynamodb update-item \
            --table-name mmc-dashboard-deployments \
            --key "{\"deployment_id\": {\"S\": \"${{ github.run_id }}\"}}" \
            --update-expression "SET #status = :status, completed_at = :timestamp" \
            --expression-attribute-names "{\"#status\": \"status\"}" \
            --expression-attribute-values "{\":status\": {\"S\": \"success\"}, \":timestamp\": {\"N\": \"$(date +%s)\"}}"

      - name: Notify production deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Deployed to Production** - https://mmc.dashboard.example.com\n\n✅ Blue/Green deployment complete\n✅ Smoke tests: PASSED\n✅ P99 latency: <500ms'
            })

      - name: Rollback on failure
        if: failure()
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "🔄 Rolling back production deployment..."
          cd terraform
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                        -backend-config="key=mmc-dashboard-production/terraform.tfstate" \
                        -backend-config="region=${{ secrets.AWS_REGION }}"
          # Revert to previous state
          git checkout HEAD~1 -- terraform/
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          echo "✅ Rollback complete"

  # ────────────────────────────────────────────────────────────────────────
  # SUMMARY - Final status check
  # ────────────────────────────────────────────────────────────────────────
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        unit-tests,
        integration-tests,
        security-tests,
        performance-tests,
        build,
      ]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.typecheck.result }}" = "failure" ] || \
             [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.integration-tests.result }}" = "failure" ] || \
             [ "${{ needs.security-tests.result }}" = "failure" ] || \
             [ "${{ needs.performance-tests.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ CI/CD Pipeline Failed"
            exit 1
          fi
          echo "✅ CI/CD Pipeline Passed"
