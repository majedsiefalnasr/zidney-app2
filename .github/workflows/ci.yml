name: CI

on:
  push:
    branches:
      - main
      - "infra-*"
      - "feature/*"
      - "fix/*"
  pull_request:
    branches:
      - main
      - develop

env:
  BUN_VERSION: "1.3.11"
  TRIVY_VERSION: "v0.69.3"
  REDIS_URL: "redis://localhost:6379"
  REDIS_PASSWORD: ""

# ─────────────────────────────────────────────────────────────────
# PARALLELIZATION STRATEGY (Phase 4 Optimization)
# ─────────────────────────────────────────────────────────────────
# Group 1 (0-5 min, parallel):    lint, typecheck, arch-guard, security
# Group 2 (5-13 min, parallel):   unit-tests, integration-tests, coverage-validation
# Group 3 (13-28 min, parallel):  e2e-mmc, e2e-backoffice, e2e-frontoffice
# Group 4 (early, reports at end): build-verification (after Group 1)
#
# Cache Strategy:
# - node_modules: Keyed on bun.lock, saves 2-3 min per job
# - ai-context artifacts: Keyed on package.json + source files
#
# Critical Path Reduction: 34-50 min → ~13 min (with cache: ~8 min)

jobs:
  # ─────────────────────────────────────────────────────────────────
  # GROUP 1: CODE QUALITY (Parallelizable, 0-5 min)
  # ─────────────────────────────────────────────────────────────────

  # ── Job 1. Lint ────────────────────────────────────────────────────────
  lint:
    name: "Biome — Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build packages (lightweight)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun run build:packages

      - name: Install redis CLI (redis-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
        shell: bash

      - name: Run Biome lint + format check
        run: bun run lint

  # ── Job 2. Type Check ──────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build packages (lightweight)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun run build:packages

      - name: Type check source
        run: bun run typecheck:src

      - name: Type check tests
        run: bun run typecheck:tests

  # ── Job 3. Architecture Guard (OPTIMIZED: Parallel, no deps) ─────────────
  arch-guard:
    name: "AI-Guard — Architecture Boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Restore ai-context artifacts cache (T086)
        uses: actions/cache@v4
        id: cache-ai-context
        with:
          path: docs/ai/context/
          key: ai-context-${{ hashFiles('package.json', 'bun.lock', 'scripts/ai-context/**/*') }}
          restore-keys: ai-context-

      - name: module-boundary-validation
        run: bun run arch:guard

      - name: Generate ai-context on cache miss
        if: steps.cache-ai-context.outputs.cache-hit != 'true'
        run: bun run ai:context:refresh

      - name: AI Agent Runtime Status Check
        run: bun run ai:runtime:status

      - name: Save ai-context artifacts cache (T087)
        if: steps.cache-ai-context.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docs/ai/context/
          key: ai-context-${{ hashFiles('package.json', 'bun.lock', 'scripts/ai-context/**/*') }}

  # ── Job 4. Repository Doctor (INFRA-18: DX Automation) ──────────────────
  repo-doctor:
    name: "Repo Doctor — DX Health Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run repo:doctor
        run: bun repo:doctor

  security:
    name: "Trivy Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NO_V="${TRIVY_VERSION#v}"
          ASSET="trivy_${VERSION_NO_V}_Linux-64bit.tar.gz"
          CHECKSUMS="trivy_${VERSION_NO_V}_checksums.txt"

          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${ASSET}"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${CHECKSUMS}"
          grep " ${ASSET}$" "${CHECKSUMS}" | shasum -a 256 -c -
          tar -xzf "${ASSET}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Run Trivy Security Scan
        run: bun run infra:security:ci

      - name: Upload sanitized Trivy report
        if: always() && hashFiles('tmp/trivy-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: tmp/trivy-report.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GROUP 2: TESTS (Parallelizable, 5-13 min)
  # ─────────────────────────────────────────────────────────────────

  # ── Job 4. Unit Tests (OPTIMIZED: Depends only on lint+typecheck) ───────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - typecheck
      - security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Assert all skip markers are annotated
        run: |
          UNANNOTATED=""
          while IFS= read -r -d '' f; do
            if ! grep -q 'SKIP REASON\|QUARANTINE' "$f"; then
              UNANNOTATED="$UNANNOTATED\n  $f"
            fi
          done < <(grep -rl --include='*.test.ts' --include='*.spec.ts' -Z '\.skip(' tests/ packages/ apps/ 2>/dev/null)

          if [ -n "$UNANNOTATED" ]; then
            printf "ERROR: Files with .skip() but no SKIP REASON or QUARANTINE annotation:%b\n" "$UNANNOTATED"
            exit 1
          fi
          echo "✓ All skip markers are annotated."

      - name: Run unit tests (all projects)
        run: bun run test:unit

      - name: Run module boundary unit tests
        run: bun run test:unit:boundaries

  # ── Job 5. Integration Tests (OPTIMIZED: Parallel with unit-tests) ──────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - arch-guard
      - security
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zidney_test
          POSTGRES_PASSWORD: zidney_test
          POSTGRES_DB: zidney_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://zidney_test:zidney_test@localhost:5432/zidney_master_test
      TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production
      # Explicit DB envs consumed by `scripts/init-test-db.sh` and integration tests.
      # NOTE: These are the admin/test credentials used by the postgres service
      # that the job brings up via the `services.postgres` configuration. The
      # `init-test-db.sh` script expects `DB_HOST/DB_PORT/DB_USER/DB_PASSWORD`
      # and `MASTER_DB_NAME` to be present; exporting them here makes the
      # script deterministic and improves CI reproducibility.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: zidney_test
      DB_PASSWORD: zidney_test
      MASTER_DB_NAME: zidney_master_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install postgres client (for `pg_isready`)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
        shell: bash

      - name: Install redis CLI (for `redis-cli`)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
        shell: bash

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U zidney_test; do sleep 1; done
          until redis-cli -h localhost ping | grep PONG; do sleep 1; done

      - name: Initialize test database
        run: bash scripts/init-test-db.sh

      - name: Verify DB initialization
        run: |
          set -euo pipefail
          echo "Verifying master database '$MASTER_DB_NAME' and 'workspaces' table..."
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$MASTER_DB_NAME" -c "SELECT 1 FROM workspaces LIMIT 1;" || {
            echo "ERROR: verification query failed — workspaces table may be missing" >&2
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$MASTER_DB_NAME" -c "\dt;" || true
            exit 1
          }

      - name: Run integration tests
        env:
          VITE_CJS_IGNORE_WARNING: "true"
        run: bun run test:integration

      - name: Dump Postgres logs (on failure)
        # This step collects diagnostics when the integration-tests job fails.
        # It saves docker container listings, postgres container logs and
        # a few psql diagnostics into `tmp/ci-postgres-logs/`, then uploads
        # them as an artifact in the following step. The step is guarded by
        # `if: failure()` so it runs only on job failure and helps debugging
        # flaky or startup-related DB issues in CI.
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=tmp/ci-postgres-logs
          mkdir -p "$OUT_DIR"
          echo "=== CI DIAGNOSTICS: Postgres logs (attempt) ==="

          echo "Listing docker containers:" | tee "$OUT_DIR/docker-containers.txt"
          docker ps -a --format 'ID={{.ID}} Name={{.Names}} Image={{.Image}} Status={{.Status}}' | tee -a "$OUT_DIR/docker-containers.txt" || true

          echo "Trying to find Postgres container by name or image..." | tee -a "$OUT_DIR/docker-containers.txt"
          if docker ps -a --format '{{.Names}}' | grep -q '^postgres$'; then
            echo "Found container 'postgres' — dumping logs to $OUT_DIR/docker-logs.txt"
            docker logs postgres 2>&1 | tee "$OUT_DIR/docker-logs.txt" || true
          else
            CONTAINER_ID=$(docker ps -a --filter "ancestor=postgres:15-alpine" --format '{{.ID}}' | head -n1 || true)
            if [ -n "$CONTAINER_ID" ]; then
              echo "Found container ID $CONTAINER_ID — dumping logs to $OUT_DIR/docker-logs.txt"
              docker logs "$CONTAINER_ID" 2>&1 | tee "$OUT_DIR/docker-logs.txt" || true
            else
              echo "No Postgres container found by name or image." | tee "$OUT_DIR/docker-logs.txt"
              echo "Dumping last 100 lines of docker.service journal to $OUT_DIR/journalctl-docker.txt" || true
              journalctl -u docker --no-pager -n 100 2>&1 | tee "$OUT_DIR/journalctl-docker.txt" || true
            fi
          fi

          echo "Attempting psql connectivity checks; outputs saved to $OUT_DIR/psql-diagnostics.txt"
          export PGPASSWORD="${DB_PASSWORD:-}"
          {
            echo "-- psql\l"
            psql -h "${DB_HOST:-localhost}" -p "${DB_PORT:-5432}" -U "${DB_USER:-zidney_test}" -d "${MASTER_DB_NAME:-zidney_master_test}" -c "\l" 2>&1 || true
            echo "-- \dt (tables)"
            psql -h "${DB_HOST:-localhost}" -p "${DB_PORT:-5432}" -U "${DB_USER:-zidney_test}" -d "${MASTER_DB_NAME:-zidney_master_test}" -c "\dt" 2>&1 || true
          } | tee "$OUT_DIR/psql-diagnostics.txt"

          echo "Saved diagnostics files to $OUT_DIR. Printing tail of docker logs for quick visibility:"
          tail -n 200 "$OUT_DIR/docker-logs.txt" || true
          echo "=== End Postgres diagnostics ==="

      - name: Upload Postgres diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-diagnostics
          path: tmp/ci-postgres-logs/
          retention-days: 7

  # ── Job 6. Coverage Validation (OPTIMIZED: Parallel queue) ──────────────
  coverage-validation:
    name: Coverage Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage (enforces thresholds)
        run: bun run test:unit --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # GROUP 3: E2E TESTS (Parallelizable, 13-28 min)
  # ─────────────────────────────────────────────────────────────────

  # ── Job 5a. E2E — MMC ─────────────────────────────────────────────────
  e2e-mmc:
    name: "E2E: MMC"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start MMC dev server
        run: bun run dev:mmc &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for MMC dev server
        run: bunx wait-on http://localhost:5173 --timeout 60000

      - name: Run MMC E2E tests
        run: bun run test:e2e:mmc

      - name: Upload MMC Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mmc
          path: apps/mmc/playwright-report/
          retention-days: 7

  # ── Job 5b. E2E — Backoffice ───────────────────────────────────────────
  e2e-backoffice:
    name: "E2E: Backoffice"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Backoffice dev server
        run: bun run dev:backoffice &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for Backoffice dev server
        run: bunx wait-on http://localhost:5174 --timeout 60000

      - name: Run Backoffice E2E tests
        run: bun run test:e2e:backoffice

      - name: Upload Backoffice Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-backoffice
          path: apps/backoffice/playwright-report/
          retention-days: 7

  # ── Job 5c. E2E — Frontoffice ──────────────────────────────────────────
  e2e-frontoffice:
    name: "E2E: Frontoffice"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Frontoffice dev server
        run: bun run dev:frontoffice &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for Frontoffice dev server
        run: bunx wait-on http://localhost:5175 --timeout 60000

      - name: Run Frontoffice E2E tests
        run: bun run test:e2e:frontoffice

      - name: Upload Frontoffice Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontoffice
          path: apps/frontoffice/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GROUP 4: POLICY GATE (Replaces build-verification — runs policy engine)
  # ─────────────────────────────────────────────────────────────────

  # ── Job 7. Policy Gate ──────────────────────────────────────────
  policy-gate:
    name: Policy Gate (FIX-03)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - typecheck
      - arch-guard
      - security
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zidney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('bun.lock') }}
          restore-keys: nodemodules-

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run policy gate (--full)
        run: bun run validate:policy -- --full
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ─────────────────────────────────────────────────────────────────
  # FINAL STATUS JOB (Reports completion after all groups)
  # ─────────────────────────────────────────────────────────────────

  ci-success:
    name: "✓ CI Pipeline Complete"
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - arch-guard
      - security
      - unit-tests
      - integration-tests
      - coverage-validation
      - e2e-mmc
      - e2e-backoffice
      - e2e-frontoffice
      - policy-gate
    if: success()
    steps:
      - name: CI Pipeline Successfully Completed
        run: echo "✓ All checks passed"
