name: CI

on:
  push:
    branches:
      - main
      - "infra-*"
      - "feature/*"
      - "fix/*"
  pull_request:
    branches:
      - main

env:
  BUN_VERSION: latest

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint --reporter=verbose

      - name: Check Prettier formatting
        run: bun run format:check

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Type Check
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check source
        run: bun run typecheck:src

      - name: Type check tests
        run: bun run typecheck:tests

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Unit Tests
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert all skip markers are annotated
        run: |
          UNANNOTATED=""
          for f in $(grep -rl '\.skip(' tests/ packages/ apps/ --include='*.test.ts' --include='*.spec.ts' 2>/dev/null); do
            if ! grep -q 'SKIP REASON\|QUARANTINE' "$f"; then
              UNANNOTATED="$UNANNOTATED\n  $f"
            fi
          done
          if [ -n "$UNANNOTATED" ]; then
            printf "ERROR: Files with .skip() but no SKIP REASON or QUARANTINE annotation:%b\n" "$UNANNOTATED"
            exit 1
          fi
          echo "✓ All skip markers are annotated."

      - name: Run unit tests (all projects)
        run: bun run test:unit --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Integration Tests
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zidney_test
          POSTGRES_PASSWORD: zidney_test
          POSTGRES_DB: zidney_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://zidney_test:zidney_test@localhost:5432/zidney_master_test
      TEST_REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U zidney_test; do sleep 1; done
          until redis-cli -h localhost ping | grep PONG; do sleep 1; done

      - name: Initialize test database
        run: bash scripts/init-test-db.sh

      - name: Run integration tests
        run: bun run test:integration --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: E2E Tests
  # ──────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start MMC dev server (port 5173)
        run: bun run dev:mmc &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Start Backoffice dev server (port 5174)
        run: bun run dev:backoffice &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Start Frontoffice dev server (port 5175)
        run: bun run dev:frontoffice &
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for dev servers to be ready
        run: bunx wait-on http://localhost:5173 http://localhost:5174 http://localhost:5175 --timeout 60000

      - name: Run MMC E2E tests
        run: bun run test:e2e:mmc

      - name: Run Backoffice E2E tests
        run: bun run test:e2e:backoffice

      - name: Run Frontoffice E2E tests
        run: bun run test:e2e:frontoffice

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/mmc/playwright-report/
            apps/backoffice/playwright-report/
            apps/frontoffice/playwright-report/
          retention-days: 7
