services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zidney_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgbouncer:
  #   image: pgbouncer/pgbouncer:latest
  #   environment:
  #     PGBOUNCER_DATABASE_HOST: postgres
  #     PGBOUNCER_DATABASE_PORT: 5432
  #     PGBOUNCER_DATABASE_USER: postgres
  #     PGBOUNCER_DATABASE_PASSWORD: password
  #     PGBOUNCER_POOL_MODE: transaction
  #   ports:
  #     - "6432:6432"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
