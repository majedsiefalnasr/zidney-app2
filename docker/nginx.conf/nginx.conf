# Nginx Configuration for Zidney Platform
# 
# Purpose:
#   - Reverse proxy to API (Bun + Hono)
#   - Rate limiting
#   - Security headers
#   - Health checks
#
# Trust Chain:
#   nginx → api service (Docker internal network)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with correlation IDs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'correlation_id="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream: API service (docker-compose service name)
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # HTTP server (redirect to HTTPS in production)
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no auth required)
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Pass through to API service
            proxy_pass http://api_backend;

            # Preserve headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            # Websocket support (for exam live connections)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth endpoints (stricter rate limit)
        location ~ /api/auth/(login|register|token) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backoffice WebSocket endpoint (STAGE_17)
        # Requires HTTP → WS upgrade passthrough.
        # Long-lived connection: proxy_read_timeout must exceed WS_LICENSE_POLL_INTERVAL_MS max (120s).
        location /ws/backoffice {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            # Long-lived connection timeouts (3600s > exam duration)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # Backoffice SPA — Vue 3 static assets (STAGE_17)
        # try_files handles client-side routing so that Vue Router deep links work.
        location /backoffice/ {
            alias /usr/share/nginx/html/backoffice/;
            try_files $uri $uri/ /backoffice/index.html;

            # Long-cache immutable hashed assets produced by Vite
            location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Default: 404
        location / {
            return 404;
        }
    }
}
